[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-invoice-dataset"
version = "0.1.0"
description = "Build a local dataset of invoice/receipt PDFs from a Gmail account, for testing document-extraction models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
gmail-invoice-dataset = "gmail_invoice_dataset.cli:main"
gmail-invoice-dataset-sort = "gmail_invoice_dataset.classify:main"

[tool.setuptools.packages.find]
where = ["src"]
