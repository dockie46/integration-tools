[project]
name = "gmail-read"
version = "0.3.0"
description = "Read Gmail locally (desktop OAuth client) or on AWS Lambda."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-oauth",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
]

[project.scripts]
gmail-read = "gmail_read.read_cli:main"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
