[project]
name = "integration-providers"
version = "0.1.0"
description = "Provider factory over mail, calendar and file integrations (Google, iCloud, S3, …)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gmail-read",
    "gcal-read",
    "google-oauth",
    "icloud-read",
    "gdrive",
    "s3files",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integration_providers"]
