[project]
name = "mscal-read"
version = "0.1.0"
description = "Microsoft 365 (Graph) calendars: read, free/busy, idempotent event writes and delta sync for room mailboxes (app-only)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mscal_read"]
